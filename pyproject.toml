[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmem"
version = "0.1.0"
description = "Provenance-aware cognitive memory for long-term dialogue"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "demjson3>=3.0.6",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27",
    "networkx>=3.2",
    "nltk>=3.8",
    "numpy>=1.26",
    "openai>=1.40.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Silent-Rain02/CogMem"
Repository = "https://github.com/Silent-Rain02/CogMem"
Issues = "https://github.com/Silent-Rain02/CogMem/issues"

[tool.setuptools.packages.find]
include = ["cogmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The legacy research code has not yet been fully style-normalized. CI blocks
# syntax errors, undefined names, and invalid control flow without rewriting
# the experimental implementation during the pre-release cleanup.
select = ["E9", "F63", "F7", "F82"]
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"
